name: One-time dependency lock refresh

on:
  push:
    branches: [engineering/ci-quality-gate]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up supported Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Regenerate lockfile without install scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Apply compatible advisory fixes
        continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Verify clean reproducible installation
        run: npm ci

      - name: Verify formatting
        run: npm run format:check

      - name: Block high and critical production advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Lint and type-check
        run: npm run lint

      - name: Run unit and integration coverage suite
        run: npm run test:coverage

      - name: Run legacy regression suites
        run: npm run test:legacy

      - name: Build production artifacts
        run: npm run build

      - name: Build production container
        run: docker build --tag redhack-ai:lock-refresh .

      - name: Commit lockfile and remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-lockfile.yml
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes were necessary."
            exit 0
          fi
          git commit -m "chore(deps): refresh npm lockfile and apply safe advisory fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
