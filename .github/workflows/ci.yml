name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting (backend, security modules, and tests)
        run: npm run format:check

      - name: Audit production dependencies for critical vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint and type-check
        run: npm run lint

      - name: Run unit and integration tests with coverage thresholds
        run: npm run test:coverage

      - name: Run legacy regression suites
        run: npm run test:legacy

      - name: Build production artifacts
        run: npm run build

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag redhack-ai:ci .
